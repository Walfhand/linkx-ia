name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build LinkxAi.slnx -c Release
      - run: dotnet test LinkxAi.slnx -c Release --no-build
      - run: node training/check-dotnet.mjs
      - run: node --test scripts/diagnose-nnue.test.mjs
      - run: node --test training/evaluate-loop.test.mjs
      - name: Check native NNUE against PyTorch reference predictions
        run: |
          for width in 256 512 1024; do
            node training/check-dotnet.mjs "models/nnue-v1/h$width"
          done
      - run: docker build -t linkx-ai:test .

  training-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: training/requirements-cpu.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build tools/LinkxAi.Analysis -c Release
      - run: python -m pip install -r training/requirements-cpu.txt
      - run: python -m unittest discover -s training -p 'test_*.py'
      - name: Check deterministic teacher generation
        run: |
          git init "$RUNNER_TEMP/linkx-reference"
          git -C "$RUNNER_TEMP/linkx-reference" remote add origin https://github.com/marmelab/linkx.git
          git -C "$RUNNER_TEMP/linkx-reference" fetch --depth 1 origin f8f07bdc6c042d11105ca0da24f00d32e1238e01
          git -C "$RUNNER_TEMP/linkx-reference" checkout --detach FETCH_HEAD
          LINKX_REFERENCE="$RUNNER_TEMP/linkx-reference" node --test training/generate.test.mjs
          LINKX_REFERENCE="$RUNNER_TEMP/linkx-reference" node --test scripts/diagnose-nnue.test.mjs
          LINKX_REFERENCE="$RUNNER_TEMP/linkx-reference" node --test training/selfplay.test.mjs
